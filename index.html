}
* { box-sizing:border-box; }
body {
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;

}
header {

}
header h1 { margin:0 0 .35rem; font-size:1.45rem; font-weight:700; }
header p { margin:0; color:var(--muted); font-size:.9rem; }
.badge { display:inline-block; background:var(--chip); color:var(--accent2); padding:.15rem .5rem; border-radius:999px; font-size:.75rem; margin-left:.4rem; }
.controls {
  max-width:1100px; margin:0 auto; padding:.5rem 1.25rem 1rem;
  display:grid; gap:.65rem; grid-template-columns:1fr;
}
@media (min-width:720px) {
  .controls { grid-template-columns:2fr 1fr 1fr 1fr; }
}
input, select {
  width:100%; padding:.65rem .75rem; border-radius:.6rem; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:.95rem;
}
input:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
.meta-bar {
  max-width:1100px; margin:0 auto; padding:0 1.25rem .75rem;
  display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; color:var(--muted); font-size:.85rem;
}
.legend {
  max-width:1100px; margin:0 auto; padding:0 1.25rem .5rem;
  display:flex; flex-wrap:wrap; gap:.75rem; font-size:.8rem; color:var(--muted);
}
.legend span { display:inline-flex; align-items:center; gap:.35rem; }
.dot { width:.65rem; height:.65rem; border-radius:999px; display:inline-block; }
.dot-deadline { background:var(--deadline); }
.dot-event { background:var(--event); }
.dot-past { background:var(--past); }

.calendar-wrap {
  max-width:1100px; margin:0 auto 1rem; padding:0 1.25rem;
}
.calendar {
  background:var(--card); border:1px solid var(--border); border-radius:1rem; padding:.85rem 1rem 1rem;
}
.cal-header {
  display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.65rem;
}
.cal-header h2 { margin:0; font-size:1.1rem; font-weight:650; }
.cal-nav {
  display:flex; gap:.4rem;
}
.cal-nav button {
  background:var(--chip); color:var(--text); border:1px solid var(--border);
  border-radius:.5rem; padding:.4rem .7rem; cursor:pointer; font-size:.85rem;
}
.cal-nav button:hover { border-color:var(--accent); }
.cal-weekdays, .cal-grid {
  display:grid; grid-template-columns:repeat(7, 1fr); gap:.3rem;
}
.cal-weekdays span {
  text-align:center; color:var(--muted); font-size:.75rem; padding:.25rem 0;
}
.cal-day {
  min-height:4.2rem; background:#141c28; border:1px solid transparent; border-radius:.55rem;
  padding:.25rem .3rem; cursor:default; position:relative; display:flex; flex-direction:column; gap:.15rem;
}
.cal-day.has-items { cursor:pointer; }
.cal-day.has-items:hover, .cal-day.selected { border-color:var(--accent); background:#1a2838; }
.cal-day.other-month { opacity:.35; }
.cal-day.today .day-num { color:var(--today); font-weight:700; }
.cal-day.past-day { opacity:.55; }
.day-num { font-size:.8rem; color:var(--muted); }
.cal-markers { display:flex; flex-wrap:wrap; gap:.15rem; margin-top:auto; }
.marker {
  font-size:.62rem; line-height:1.2; padding:.1rem .28rem; border-radius:.3rem;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.marker.deadline { background:rgba(240,160,61,.22); color:var(--deadline); }
.marker.event { background:rgba(91,214,162,.18); color:var(--event); }
.marker.past { background:rgba(90,101,117,.25); color:var(--past); }
.marker-more { font-size:.62rem; color:var(--muted); }

.day-detail {
  margin-top:.75rem; border-top:1px solid var(--border); padding-top:.75rem;
  display:none;
}
.day-detail.open { display:block; }
.day-detail h3 { margin:0 0 .5rem; font-size:.95rem; }
.day-detail ul { list-style:none; margin:0; padding:0; display:grid; gap:.45rem; }
.day-detail li {
  background:#141c28; border-radius:.55rem; padding:.55rem .7rem; font-size:.85rem;
}
.day-detail .tag {
  display:inline-block; font-size:.7rem; padding:.1rem .4rem; border-radius:999px; margin-right:.35rem;
}
.tag-deadline { background:rgba(240,160,61,.22); color:var(--deadline); }
.tag-event { background:rgba(91,214,162,.18); color:var(--event); }
.day-detail a { color:var(--accent); text-decoration:none; }
.day-detail a:hover { text-decoration:underline; }
.day-detail .muted { color:var(--muted); font-size:.8rem; }
.day-detail.empty-msg { color:var(--muted); font-size:.85rem; }

.list { max-width:1100px; margin:0 auto; padding:0 1.25rem 2.5rem; display:grid; gap:.85rem; }
.card {
  background:var(--card); border:1px solid var(--border); border-radius:1rem; padding:1rem 1.1rem;
  transition:border-color .15s;

.card:hover { border-color:var(--accent); }
.card.dim { opacity:.55; }
.card-top { display:flex; flex-wrap:wrap; justify-content:space-between; gap:.5rem; align-items:flex-start; }
.card h2 { margin:0; font-size:1.05rem; line-height:1.35; }

.domain { color:var(--accent2); font-size:.8rem; margin-top:.25rem; }
.grid { display:grid; gap:.35rem .75rem; margin-top:.7rem; font-size:.88rem;
  grid-template-columns:1fr; }

.grid dt { color:var(--muted); font-size:.75rem; }
.grid dd { margin:0 0 .35rem; }
.summary { margin:.7rem 0 0; color:#c5d0dc; font-size:.9rem; line-height:1.45; }
.chips { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.65rem; }
.chip { background:var(--chip); border-radius:999px; padding:.2rem .55rem; font-size:.75rem; color:var(--muted); }
.chip strong { color:var(--text); }
.links { margin-top:.65rem; display:flex; flex-wrap:wrap; gap:.75rem; font-size:.85rem; }
.links a { color:var(--accent); text-decoration:none; }
.links a:hover { text-decoration:underline; }
.empty { text-align:center; color:var(--muted); padding:2rem; }
footer { text-align:center; color:var(--muted); font-size:.75rem; padding:0 1rem 2rem; }

@media (max-width:520px) {
  .cal-day { min-height:3.4rem; padding:.2rem; }
  .marker { font-size:.55rem; padding:.08rem .2rem; }
  .cal-weekdays span { font-size:.68rem; }

</style>

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uniqueDomains(events) {
  const set = new Set();
  events.forEach(e => {
    (e.domain || "").split("/").forEach(p => {
      const t = p.trim();
      if (t) set.add(t);
    });
    if (e.domain) set.add(e.domain);
  });
  return [...set].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
}

function parseISODate(s) {
  if (!s || typeof s !== "string") return null;
  const m = s.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return `${m[1]}-${m[2]}-${m[3]}`;
}

/** Extract concrete YYYY-MM-DD from free text; skip year-only / month-only. */
function extractDatesFromText(text) {
  if (!text || typeof text !== "string") return [];
  const found = [];
  const re = /(\d{4})-(\d{2})-(\d{2})/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const y = +m[1], mo = +m[2], d = +m[3];
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
      found.push(`${m[1]}-${m[2]}-${m[3]}`);
    }
  }
  return [...new Set(found)];
}

function isPast(iso) {
  return iso < AS_OF;
}

function shortName(name) {
  if (!name) return "";
  return name.length > 10 ? name.slice(0, 9) + "…" : name;
}

function buildDateIndex(events) {
  const idx = {};
  function add(iso, entry) {
    if (!iso) return;
    if (!idx[iso]) idx[iso] = [];
    // dedupe same event+type
    if (idx[iso].some(x => x.event.id === entry.event.id && x.type === entry.type)) return;
    idx[iso].push(entry);
  }
  events.forEach(e => {
    const pastFlag = e.upcoming === false;
    const dl = parseISODate(e.deadline);
    if (dl) {
      add(dl, {
        event: e,
        type: "deadline",
        label: "截止",
        past: pastFlag || isPast(dl)
      });
    }
    const eventDates = extractDatesFromText(e.event_dates);
    eventDates.forEach(iso => {
      // If same as deadline and text says 截止, still allow as event if it's in event_dates
      // Skip if this date is clearly labeled 截止 in a clause — we only parse ISO digits
      add(iso, {
        event: e,
        type: "event",
        label: "比賽／活動",
        past: pastFlag || isPast(iso)
      });
    });
  });
  return idx;
}

function filteredEvents() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const domain = document.getElementById("domain").value;
  const minScore = Number(document.getElementById("minScore").value);
  let rows = DATA.events.slice();
  rows = rows.filter(e => {
    if ((e.total_recommend || 0) < minScore) return false;
    if (domain && !(e.domain || "").includes(domain)) return false;
    if (!q) return true;
    const blob = [e.name, e.name_en, e.domain, e.organizer, e.summary, e.eligibility, e.notes]
      .filter(Boolean).join(" ").toLowerCase();
    return blob.includes(q);
  });
  return rows;
}

function initCalMonth() {
  const parts = AS_OF.split("-");
  calYear = +parts[0];
  calMonth = +parts[1];
}

function pad2(n) { return String(n).padStart(2, "0"); }

function renderCalendar() {
  const filtered = filteredEvents();
  const allowed = new Set(filtered.map(e => e.id));
  dateIndex = buildDateIndex(DATA.events);

  const title = document.getElementById("calTitle");
  title.textContent = `${calYear} 年 ${calMonth} 月`;

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  const first = new Date(calYear, calMonth - 1, 1);
  const startDow = first.getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const prevDays = new Date(calYear, calMonth - 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startDow; i++) {
    const d = prevDays - startDow + 1 + i;
    let y = calYear, m = calMonth - 1;
    if (m < 1) { m = 12; y--; }
    cells.push({ y, m, d, other: true });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ y: calYear, m: calMonth, d, other: false });
  }
  const trailing = [];
  let ny = calYear, nm = calMonth + 1;
  if (nm > 12) { nm = 1; ny++; }
  let nd = 1;
  const baseLen = startDow + daysInMonth;
  const totalCells = Math.ceil(baseLen / 7) * 7;
  for (let i = baseLen; i < totalCells; i++) {
    trailing.push({ y: ny, m: nm, d: nd++, other: true });
  }
  const allCells = cells.concat(trailing);

  allCells.forEach(cell => {
    const key = `${cell.y}-${pad2(cell.m)}-${pad2(cell.d)}`;
    const items = (dateIndex[key] || []).filter(x => allowed.has(x.event.id));
    // prefer upcoming: sort upcoming first, deadlines before events
    items.sort((a, b) => {
      const ua = a.event.upcoming === false ? 1 : 0;
      const ub = b.event.upcoming === false ? 1 : 0;
      if (ua !== ub) return ua - ub;
      if (a.type !== b.type) return a.type === "deadline" ? -1 : 1;
      return (b.event.total_recommend || 0) - (a.event.total_recommend || 0);
    });

    const div = document.createElement("div");
    div.className = "cal-day";
    if (cell.other) div.classList.add("other-month");
    if (key === AS_OF) div.classList.add("today");
    if (items.length && items.every(x => x.past)) div.classList.add("past-day");
    if (items.length) div.classList.add("has-items");
    if (selectedKey === key) div.classList.add("selected");
    div.setAttribute("role", "gridcell");
    div.dataset.key = key;

    const num = document.createElement("div");
    num.className = "day-num";
    num.textContent = String(cell.d);
    div.appendChild(num);

    const markers = document.createElement("div");
    markers.className = "cal-markers";
    const show = items.slice(0, 3);
    show.forEach(it => {
      const m = document.createElement("span");
      m.className = "marker " + (it.past ? "past" : it.type);
      m.title = `${it.label}：${it.event.name}`;
      m.textContent = (it.type === "deadline" ? "截 " : "賽 ") + shortName(it.event.name);
      markers.appendChild(m);
    });
    if (items.length > 3) {
      const more = document.createElement("span");
      more.className = "marker-more";
      more.textContent = `+${items.length - 3}`;
      markers.appendChild(more);
    }
    div.appendChild(markers);

    if (items.length || !cell.other) {
      div.addEventListener("click", () => {
        selectedKey = key;
        renderCalendar();
        renderDayDetail(key, items);
      });
    }
    grid.appendChild(div);
  });

  if (selectedKey) {
    const items = (dateIndex[selectedKey] || []).filter(x => allowed.has(x.event.id));
    // re-sort
    items.sort((a, b) => {
      const ua = a.event.upcoming === false ? 1 : 0;
      const ub = b.event.upcoming === false ? 1 : 0;
      if (ua !== ub) return ua - ub;
      if (a.type !== b.type) return a.type === "deadline" ? -1 : 1;
      return (b.event.total_recommend || 0) - (a.event.total_recommend || 0);
    });
    renderDayDetail(selectedKey, items);
  } else {
    document.getElementById("dayDetail").classList.remove("open");
    document.getElementById("dayDetail").innerHTML = "";
  }
}

function renderDayDetail(key, items) {
  const el = document.getElementById("dayDetail");
  const [y, m, d] = key.split("-");
  el.classList.add("open");
  if (!items.length) {
    el.innerHTML = `<h3>${y} 年 ${+m} 月 ${+d} 日</h3><p class="empty-msg">當日無符合篩選條件的截止或比賽日（或未能從文字解析出日期）。</p>`;
    return;
  }
  const lis = items.map(it => {
    const e = it.event;
    const tagCls = it.type === "deadline" ? "tag-deadline" : "tag-event";
    const link = e.official_link
      ? `<a href="${escapeHtml(e.official_link)}" target="_blank" rel="noopener">官方連結</a>`
      : `<span class="muted">無官方連結</span>`;
    const pastNote = it.past ? ` <span class="muted">（已過／非 upcoming）</span>` : "";
    return `<li>
      <span class="tag ${tagCls}">${escapeHtml(it.label)}</span>
      <strong>${escapeHtml(e.name)}</strong>${pastNote}
      <div class="muted">${escapeHtml(e.domain || "")} · 總分 ${e.total_recommend}</div>
      <div>${link}</div>
    </li>`;
  }).join("");
  el.innerHTML = `<h3>${y} 年 ${+m} 月 ${+d} 日 · ${items.length} 項</h3><ul>${lis}</ul>`;
}

function render() {
  const sort = document.getElementById("sort").value;
  let rows = filteredEvents();

  rows.sort((a,b) => {
    if (sort === "name") return (a.name||"").localeCompare(b.name||"", "zh-Hant");
    if (sort === "deadline") {
      const da = a.deadline || "9999-99-99";
      const db = b.deadline || "9999-99-99";
      return da.localeCompare(db) || (b.total_recommend - a.total_recommend);
    }
    return (b.total_recommend - a.total_recommend) || (a.name||"").localeCompare(b.name||"", "zh-Hant");
  });

  document.getElementById("count").textContent = `顯示 ${rows.length} / ${DATA.events.length} 項`;
  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = '<div class="empty">沒有符合條件的活動，試下調低最低總分或清空搜尋。</div>';
  } else {
    list.innerHTML = rows.map(e => {
      const s = e.scores || {};
      const link = e.official_link
        ? `<a href="${e.official_link}" target="_blank" rel="noopener">官方連結</a>`
        : '<span style="color:var(--muted)">官方連結未列於郵件</span>';
      const dim = e.upcoming === false ? " dim" : "";
      return `<article class="card${dim}">
        <div class="card-top">
          <div>
            <h2>${escapeHtml(e.name)}</h2>
            <div class="domain">${escapeHtml(e.domain || "")}</div>
          </div>
          <div class="score">總分 ${e.total_recommend}</div>
        </div>
        <dl class="grid">
          <div><dt>截止日期 deadline</dt><dd>${escapeHtml(e.deadline || "未列")}</dd></div>
          <div><dt>比賽／活動日期</dt><dd>${escapeHtml(e.event_dates || "未列")}</dd></div>
          <div><dt>主辦</dt><dd>${escapeHtml(e.organizer || "未列")}</dd></div>
          <div><dt>資格</dt><dd>${escapeHtml(e.eligibility || "未列")}</dd></div>
        </dl>
        <p class="summary">${escapeHtml(e.summary || "")}</p>
        <div class="chips">
          <span class="chip">規模 <strong>${s.organizer_scale}</strong></span>
          <span class="chip">獎項 <strong>${s.awards}</strong></span>
          <span class="chip">認受 <strong>${s.recognition}</strong></span>
          <span class="chip">複雜 <strong>${s.complexity}</strong></span>
        </div>
        <div class="links">${link}</div>
      </article>`;
    }).join("");
  }
  renderCalendar();
}

(function init() {
  const sel = document.getElementById("domain");
  uniqueDomains(DATA.events).forEach(d => {
    const o = document.createElement("option");
    o.value = d; o.textContent = d; sel.appendChild(o);
  });
  ["q","domain","minScore","sort"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
    document.getElementById(id).addEventListener("change", render);
  });
  initCalMonth();
  document.getElementById("calPrev").addEventListener("click", () => {
    calMonth--;
    if (calMonth < 1) { calMonth = 12; calYear--; }
    selectedKey = null;
    renderCalendar();
  });
  document.getElementById("calNext").addEventListener("click", () => {
    calMonth++;
    if (calMonth > 12) { calMonth = 1; calYear++; }
    selectedKey = null;
    renderCalendar();
  });
  document.getElementById("calToday").addEventListener("click", () => {
    initCalMonth();
    selectedKey = AS_OF;
    renderCalendar();
    const allowed = new Set(filteredEvents().map(e => e.id));
    const items = (dateIndex[AS_OF] || []).filter(x => allowed.has(x.event.id));
    renderDayDetail(AS_OF, items);
  });
  render();
})();
</script>
